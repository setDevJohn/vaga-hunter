[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaga-hunter"
version = "0.1.0"
description = "Bot de busca, filtragem e ranqueamento de vagas de emprego (LinkedIn primeiro, outras fontes depois)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
posts = ["playwright>=1.45"]

[project.scripts]
vaga-hunter = "vaga_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
