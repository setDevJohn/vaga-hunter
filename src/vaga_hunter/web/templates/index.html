<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vaga-hunter</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>🎯 vaga-hunter</h1>
  <div class="controls">
    <button id="btn-search" class="primary">Buscar agora</button>
    <button id="btn-daemon" class="toggle">Daemon: …</button>
    <span id="daemon-info" class="muted"></span>
  </div>
</header>

<details id="params" class="params">
  <summary>⚙️ Parâmetros de busca</summary>
  <div class="params-grid">
    <label class="full">Buscas (uma por linha)
      <textarea id="cfg-queries" rows="5" spellcheck="false"></textarea>
    </label>
    <label>Localização <input type="text" id="cfg-location"></label>
    <label>Período
      <select id="cfg-time-range">
        <option value="r24h">últimas 24h</option>
        <option value="r3d">últimos 3 dias</option>
        <option value="r7d">últimos 7 dias</option>
        <option value="r1m">último mês</option>
      </select>
    </label>
    <label>Modalidade
      <select id="cfg-remote">
        <option value="">qualquer</option>
        <option value="remote">remoto</option>
        <option value="hybrid">híbrido</option>
        <option value="onsite">presencial</option>
      </select>
    </label>
    <label>Páginas por busca <input type="number" id="cfg-max-pages" min="1" max="10"></label>
    <label>Score p/ notificar <input type="number" id="cfg-threshold" min="0" max="100" step="5"></label>
    <div class="params-actions">
      <button id="btn-save-config" class="primary">Salvar</button>
      <span id="cfg-feedback" class="muted"></span>
    </div>
  </div>
</details>

<section id="log-panel" class="hidden">
  <pre id="log"></pre>
</section>

<section class="filters">
  <label>Status
    <select id="filter-status">
      <option value="">todos</option>
      <option value="new">novas</option>
      <option value="notified">notificadas</option>
      <option value="interested">interessado</option>
      <option value="discarded">descartadas</option>
      <option value="seen">vistas</option>
    </select>
  </label>
  <label>Score mínimo <input type="number" id="filter-score" min="0" max="100" step="5" placeholder="0"></label>
</section>

<table id="jobs">
  <thead>
    <tr><th>Score</th><th>Vaga</th><th>Empresa</th><th>Local</th><th>Publicada</th><th>Status</th><th>Ações</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
